<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste collections</title>
</head>
<body>
    <h1>Liste des Collections</h1>
<table class="table">
    <thead>
        <tr>
            <th>Titre</th>
            <th>Date de création</th>
            <th>Détails</th>
        </tr>
    </thead>
    <tbody>
        {% for collection in collections %}
        <tr>
            <td>{{ collection.title }}</td>
            <td>{{ collection.date }}</td>
            <td><a href="{% url 'collec_details' collection.id %}">Voir</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</body>
</html>
