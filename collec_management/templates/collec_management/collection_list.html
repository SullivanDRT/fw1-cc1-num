{% extends "collec_management/main.html" %}
{% block title %} Collections {% endblock %}
{% block content %}
<h1>Liste des Collections</h1>
<table class="table">
    <thead>
        <tr>
            <th>Titre</th>
            <th>Date de création</th>
            <th>Détails</th>
        </tr>
    </thead>
    <tbody>
        {% for collection in collections %}
        <tr>
            <td>{{ collection.title }}</td>
            <td>{{ collection.date }}</td>
            <td><a href="{% url 'collec_details' collection.id %}">Voir</a></td>
            <td><a href="{% url 'modifier_collec' collection.id %}">Modifier</a></td>
            <td><a href="{% url 'supprimmer_collec' collection.id %}">Supprimmer</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
