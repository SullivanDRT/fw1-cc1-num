{% extends 'collec_management/base.html' %}

{% block title %}Liste des Collections{% endblock %}

{% block content %}
<h1>Liste des Collections</h1>
<table class="table">
    <thead>
        <tr>
            <th>Titre</th>
            <th>Date de création</th>
            <th>Détails</th>
        </tr>
    </thead>
    <tbody>
        {% for collection in collections %}
        <tr>
            <td>{{ collection.title }}</td>
            <td>{{ collection.date }}</td>
            <td><a href="{% url 'collection_detail' collection.id %}">Voir</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
